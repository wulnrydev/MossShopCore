# ============================================================
#  MossShopCore  -  wulnrydev
#  Tum sistem kod degisikligi gerektirmeden bu dosyadan yonetilir.
#  Renkler: &7 normal | &#00D420 ana vurgu | &#ffd500 ikinci vurgu
#  Hex format: &#RRGGBB  (orn: &#00D420)
# ============================================================

# Mesaj on eki (tum mesajlarda %prefix% ile kullanilir)
# MossShopCore tum modlarda (Towny, SkyBlock, BoxPvP, Survival) calisan global
# bir eklentidir; prefix moda ozel degil, jenerik olmalidir.
prefix: "&#00D420&lMarket &8▸ "

# Fiyatlarin gosterim formati (Java DecimalFormat)
price-format: "#,##0.##"

# Tek seferde satin alinabilecek maksimum miktar
max-amount: 2304

# ----------------------- SESLER -----------------------
# sound: namespaced anahtar (orn: entity.player.levelup)
sounds:
  click:
    enabled: true
    sound: "ui.button.click"
    volume: 0.6
    pitch: 1.4
  purchase-success:
    enabled: true
    sound: "entity.player.levelup"
    volume: 1.0
    pitch: 1.2
  error:
    enabled: true
    sound: "entity.villager.no"
    volume: 1.0
    pitch: 1.0

# ----------------------- ANA MARKET MENUSU -----------------------
market:
  title: "&#00D420Market"
  size: 54

  # Bos slotlari dolduran dekoratif item
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  # Her urunun altina eklenecek bilgi satirlari (placeholder destekli)
  # Kullanilabilir placeholderlar: %unit-price%
  item-lore:
    - ""
    - "&7Birim Fiyat: &#00D420%unit-price%$"
    - ""
    - "&#ffd500▸ &7Satin almak icin tikla!"

  # Istege bagli dekorasyon itemleri
  decorations:
    info:
      slot: 4
      material: PAPER
      name: "&#00D420&lMARKET"
      lore:
        - "&7Asagidaki urunlere tiklayarak"
        - "&7satin alma menusunu acabilirsin."

# ----------------------- SATIN ALMA MENUSU -----------------------
purchase-menu:
  title: "&#00D420Satin Al"
  size: 54

  # Ortada satin alinacak urun gosterilir
  product-slot: 22

  # Urun altina eklenecek dinamik bilgi satirlari
  # Placeholderlar: %amount% %unit-price% %total%
  product-lore:
    - ""
    - "&7Miktar: &#ffd500%amount%"
    - "&7Birim Fiyat: &7%unit-price%$"
    - "&7Toplam: &#00D420%total%$"

  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "

  # Miktar butonlari (pozitif arttirir, negatif azaltir)
  amount-buttons:
    add1:
      slot: 24
      modifier: 1
      material: LIME_STAINED_GLASS_PANE
      name: "&a&l+1"
    add16:
      slot: 25
      modifier: 16
      material: LIME_STAINED_GLASS_PANE
      name: "&a&l+16"
    add32:
      slot: 26
      modifier: 32
      material: LIME_STAINED_GLASS_PANE
      name: "&a&l+32"
    add64:
      slot: 35
      modifier: 64
      material: LIME_STAINED_GLASS_PANE
      name: "&a&l+64"
    remove1:
      slot: 20
      modifier: -1
      material: RED_STAINED_GLASS_PANE
      name: "&c&l-1"
    remove16:
      slot: 19
      modifier: -16
      material: RED_STAINED_GLASS_PANE
      name: "&c&l-16"
    remove32:
      slot: 18
      modifier: -32
      material: RED_STAINED_GLASS_PANE
      name: "&c&l-32"
    remove64:
      slot: 9
      modifier: -64
      material: RED_STAINED_GLASS_PANE
      name: "&c&l-64"

  # Satin al butonu (placeholderlar: %amount% %unit-price% %total%)
  buy-button:
    slot: 31
    material: EMERALD_BLOCK
    name: "&a&lSATIN AL"
    lore:
      - ""
      - "&7Miktar: &#ffd500%amount%"
      - "&7Toplam: &#00D420%total%$"
      - ""
      - "&a▸ Onaylamak icin tikla!"

  # Geri don butonu. Tiklaninca asagidaki komutlar konsoldan/oyuncudan calisir.
  # commands: "[console] ..." -> konsoldan, "[player] ..." veya komut adi -> oyuncudan
  # Placeholder: %player%
  back-button:
    slot: 49
    material: BARRIER
    name: "&cGeri Don"
    lore:
      - "&7Markete geri don."
    commands:
      - "market"

# ----------------------- URUNLER -----------------------
# Sinirsiz urun eklenebilir. Her urun ana market menusunde 'slot' alaninda gosterilir.
# Desteklenen alanlar:
#   material, amount, price, slot, name, lore, glow,
#   enchantments, flags, custom-model-data, attributes, persistent-data
items:
  diamond:
    slot: 10
    material: DIAMOND
    price: 250.0
    name: "&#00D420Elmas"
    lore:
      - "&7Saf ve parlak bir elmas."

  emerald:
    slot: 11
    material: EMERALD
    price: 200.0
    name: "&#00D420Zumrut"
    lore:
      - "&7Ticaret icin idealdir."

  golden_apple:
    slot: 12
    material: GOLDEN_APPLE
    price: 500.0
    name: "&#ffd500Altin Elma"
    lore:
      - "&7Bir isirikta guc."

  # Custom item ornegi: isim, lore, enchant, flag, glow, CMD, PDC
  custom_sword:
    slot: 16
    material: NETHERITE_SWORD
    price: 25000.0
    name: "&#00D420&lEfsanevi Kilic"
    lore:
      - "&7Sadece gercek savascilar icin."
      - ""
      - "&#ffd500Ozel uretim."
    glow: true
    enchantments:
      sharpness: 5
      unbreaking: 3
      fire_aspect: 2
    flags:
      - HIDE_ENCHANTS
      - HIDE_ATTRIBUTES
    custom-model-data: 100001
    attributes:
      attack_damage:
        - amount: 12.0
          operation: ADD_NUMBER
          slot: HAND
    persistent-data:
      "mossshop:rarity":
        type: STRING
        value: "LEGENDARY"
