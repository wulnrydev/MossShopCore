name: MossShopCore
version: 1.2.0
main: dev.wulnry.mossshop.MossShopCore
api-version: '1.21'
author: wulnrydev
description: Profesyonel, yapilandirilabilir, yuksek performansli market eklentisi.
depend:
  - Vault

commands:
  market:
    description: Market menusunu acar.
    usage: /market
  mossshop:
    description: MossShopCore yonetim komutu.
    usage: /mossshop reload
    permission: mossshop.admin

permissions:
  mossshop.admin:
    description: MossShopCore yonetim izinleri (reload vb.).
    default: op
  mossshop.use:
    description: /market komutunu kullanma izni.
    default: true
  mossshop.use.*:
    description: Tum urunleri satin alma izni (urun bazli mossshop.use.<item_id>).
    default: true
